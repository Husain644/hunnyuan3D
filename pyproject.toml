[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunyuan3d-api"
version = "0.1.0"
description = "Async FastAPI service around Hunyuan3D 2.1 / 2mv image-to-3D with T4-optimized CPU offloading"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "python-dotenv>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.6",
  "pillow>=10.0",
  "numpy>=1.26",
  "huggingface-hub>=0.23",
  "transformers==4.46.0",
  "diffusers==0.30.0",
  "accelerate>=0.30",
  "safetensors>=0.4",
  "einops",
  "omegaconf",
  "pyyaml",
  "scipy>=1.11",
  "scikit-image>=0.24",
  "timm",
  "tqdm",
  "trimesh>=4.0",
  "xatlas>=0.0.9",
  "pygltflib>=1.16",
  "python-multipart>=0.0.9",
]
# NOTE: torch/torchvision are intentionally NOT listed here (a plain
# `pip install .` would pull an unpinned, wrong-platform build). Install via
# requirements-gpu.txt (CUDA-pinned) using setup.sh instead.

[project.optional-dependencies]
tex = [
  "opencv-python-headless>=4.9",
  "pymeshlab>=2023.12",
  "rembg>=2.0",
  "onnxruntime-gpu>=1.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.py"]