[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hunyuan3d-api"
version = "0.1.0"
description = "Async FastAPI service around Hunyuan3D 2.1 image-to-3D with T4-optimized CPU offloading"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pillow>=10.0",
  "numpy>=1.24",
  "torch>=2.4",
  "accelerate>=0.30",
  "trimesh>=4.0",
  "diffusers>=0.28",
  "einops",
  "omegaconf",
  "tqdm",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
shape = ["pymeshlab>=2023.12"]
tex = [
  "opencv-python-headless>=4.9",
  "xatlas>=0.0.9",
  "pygltflib>=1.16",
  "rembg>=2.0",
  "onnxruntime-gpu>=1.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.py"]